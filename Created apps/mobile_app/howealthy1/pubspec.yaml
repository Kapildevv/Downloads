name: howealthy1
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_sms_inbox: ^1.0.1
  permission_handler: ^11.0.1
  fl_chart: ^0.65.0
  google_fonts: ^6.2.1   # Pinned — was 'any' (unsafe wildcard)
  intl: '>=0.19.0 <1.0.0'

  # --- FIREBASE (UPDATED TO MATCH EACH OTHER) ---
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8  # Updated to a version that fixes the databaseURL crash
  firebase_storage: ^11.6.9
  google_sign_in: ^6.2.1

  # --- CORE UTILITIES ---
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  local_auth: ^2.2.0
  flutter_local_notifications: ^17.0.0
  path: ^1.8.3
  image_picker: ^1.0.7

  # --- ORACLE ARCHITECTURE (NEW UPGRADES) ---
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  tflite_flutter: ^0.10.4

  # --- SECURITY HARDENING (VP Security & Compliance) ---
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.4
  firebase_app_check: ^0.2.2+7
  crypto: ^3.0.6

  # --- GROWTH ENGINE (VP Growth & Marketing) ---
  app_links: ^6.4.0
  url_launcher: ^6.2.4
  uuid: ^4.5.3
  google_generative_ai: ^0.4.7
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  # Hive code generation — required for type-safe Hive adapters
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/welcome_image.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"

# ── DEPENDENCY OVERRIDES ─────────────────────────────────────────────────────
# tflite_flutter v0.10.4 has an internal Dart SDK incompatibility:
#   tensor.dart:58 — UnmodifiableUint8ListView not found on Tensor type.
# Override to upstream git main which contains the Dart 3.x compatibility fix.
# REMOVE this block once tflite_flutter publishes a compatible release to pub.dev.
dependency_overrides:
  tflite_flutter:
    git:
      url: https://github.com/tensorflow/flutter-tflite.git
      ref: main